name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Api.sln
      - name: Build
        run: dotnet build Api.sln --no-restore -c Release
      - name: Test
        run: dotnet test Api.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Prüfen, ob eine Migration fehlt
        run: |
          dotnet tool install -g dotnet-ef --version 8.0.10
          dotnet ef migrations has-pending-model-changes --project Api/Api.csproj

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Unit-Tests
        run: pnpm run test:ci
